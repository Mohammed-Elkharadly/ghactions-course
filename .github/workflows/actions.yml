on:
  workflow_dispatch:

jobs:
  strategy_job: # name of the job that will be executed (custom name)
    strategy:
      fail-fast: false # means if the job fail continue, ture = stop
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
